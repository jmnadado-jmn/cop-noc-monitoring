<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="380" height="60" fill="none">
  <!-- Royal Blue Background matching official Cathedral of Praise branding -->
  <rect width="380" height="60" rx="8" fill="#002080" />

  <!-- Official Cathedral of Praise Manila Emblem -->
  <g transform="translate(10, 5)">
    <svg viewBox="0 0 100 100" width="50" height="50">
      <!-- Top-Right Ascending Flame Plume -->
      <path d="M 48 10 C 56 6, 68 14, 68 30 C 68 38, 63 45, 57 47 C 63 40, 62 22, 48 10 Z" fill="#ffffff" />
      
      <!-- Sweeping Halo / Crescent Arc -->
      <path d="M 50 14 A 28 28 0 1 0 76 48 C 76 43, 70 42, 68 45 A 21 21 0 1 1 50 21 Z" fill="#ffffff" />
      
      <!-- Central Ascending Flame / Dove Body -->
      <path d="M 50 23 C 58 27, 62 35, 60 42 C 58 47, 51 49, 46 45 C 41 40, 43 30, 50 23 Z" fill="#ffffff" />
      <path d="M 47 44 C 49 40, 53 38, 56 36 C 54 41, 52 44, 47 44 Z" fill="#002080" />
      
      <!-- Hollow Latin Cross - Horizontal Beam -->
      <rect x="4" y="38.5" width="92" height="5" rx="1" stroke="#ffffff" stroke-width="2.2" fill="none" />
      
      <!-- Hollow Latin Cross - Vertical Shaft -->
      <rect x="47.5" y="8" width="5" height="86" rx="1" stroke="#ffffff" stroke-width="2.2" fill="none" />
    </svg>
  </g>

  <!-- Official Cathedral of Praise Wordmark matching cathedralofpraisemanila.com.ph -->
  <text x="68" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="1.8">CATHEDRAL OF PRAISE</text>
</svg>
